name: Nightly Live Tests

on:
  schedule:
    # 07:00 UTC = 15:00 Asia/Taipei. Daytime in TW so failures get same-day
    # attention rather than queuing overnight.
    - cron: "0 7 * * *"
  workflow_dispatch:

# Live tests hit real external services (httpbin, OpenAI, etc.) and require
# repository secrets. They are skipped in the regular CI workflow via the
# ``-m "not live"`` selector and gathered here so each run is a single
# accountable nightly job.

concurrency:
  group: nightly-live
  cancel-in-progress: false

jobs:
  live-tests:
    name: Live integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Run pytest (live only)
        run: uv run pytest -m "live" --maxfail=5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERACRAWL_LOG_LEVEL: INFO
          VERACRAWL_LOG_FORMAT: json
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-artifacts
          path: |
            tests/_artifacts/
            **/htmlcov/
          retention-days: 7
          if-no-files-found: ignore
