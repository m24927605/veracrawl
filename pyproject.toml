[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veracrawl"
version = "0.1.0"
description = "VeraCrawl target architecture foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
queue-redis = [
  "redis>=5.0,<6",
]
object-s3 = [
  "boto3>=1.34,<2",
]

[project.scripts]
veracrawl-contracts = "veracrawl.cli.contracts:main"
veracrawl-fixture = "veracrawl.cli.fixtures:main"
veracrawl-runtime = "veracrawl.cli.runtime:main"
veracrawl-run-control = "veracrawl.cli.run_control:main"
veracrawl-production-persistence = "veracrawl.cli.production_persistence:main"
veracrawl-durable = "veracrawl.cli.durable:main"
veracrawl-source = "veracrawl.cli.source:main"
veracrawl-source-runtime = "veracrawl.cli.source_runtime:main"
veracrawl-network = "veracrawl.cli.network:main"
veracrawl-live-http = "veracrawl.cli.live_http:main"
veracrawl-structured-source = "veracrawl.cli.structured_source:main"
veracrawl-browser-snapshot = "veracrawl.cli.browser_snapshot:main"
veracrawl-credentialed-session = "veracrawl.cli.credentialed_session:main"
veracrawl-live-normalization = "veracrawl.cli.live_normalization:main"
veracrawl-schema-extraction = "veracrawl.cli.schema_extraction:main"
veracrawl-live-evidence = "veracrawl.cli.live_evidence:main"
veracrawl-result-publication = "veracrawl.cli.result_publication:main"
veracrawl-agent-model-runtime = "veracrawl.cli.agent_model_runtime:main"
veracrawl-process = "veracrawl.cli.process:main"
veracrawl-evidence = "veracrawl.cli.evidence:main"
veracrawl-output-coverage = "veracrawl.cli.output_coverage:main"
veracrawl-website-patterns = "veracrawl.cli.website_patterns:main"
veracrawl-product-acceptance = "veracrawl.cli.product_acceptance:main"
veracrawl-target-runtime = "veracrawl.cli.target_runtime:main"
veracrawl-graph = "veracrawl.cli.graph:main"
veracrawl-projection = "veracrawl.cli.projection:main"
veracrawl-graph-frontier-review = "veracrawl.cli.graph_frontier_review:main"
veracrawl-temporal-kg = "veracrawl.cli.temporal_kg:main"
veracrawl-memory = "veracrawl.cli.memory:main"
veracrawl-graph-memory-runtime = "veracrawl.cli.graph_memory_runtime:main"
veracrawl-agent-workflow = "veracrawl.cli.agents:main"
veracrawl-ops = "veracrawl.cli.ops:main"
veracrawl-ops-runtime = "veracrawl.cli.ops_runtime:main"
veracrawl-export = "veracrawl.cli.export:main"
veracrawl-scale = "veracrawl.cli.scale:main"
veracrawl-persistence = "veracrawl.cli.persistence:main"
veracrawl-persistence-adapter = "veracrawl.cli.persistence_adapter:main"
veracrawl-queue-broker = "veracrawl.cli.queue_broker:main"
veracrawl-object-store = "veracrawl.cli.object_store:main"
veracrawl-infrastructure = "veracrawl.cli.infrastructure:main"
veracrawl-worker-orchestration = "veracrawl.cli.worker_orchestration:main"
veracrawl-dr = "veracrawl.cli.dr:main"
veracrawl-observability = "veracrawl.cli.observability:main"
veracrawl-security-privacy = "veracrawl.cli.security_privacy:main"
veracrawl-agent-adapters = "veracrawl.cli.agent_adapters:main"
veracrawl-model-providers = "veracrawl.cli.model_providers:main"
veracrawl-source-coverage = "veracrawl.cli.source_coverage:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veracrawl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
