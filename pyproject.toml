[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veracrawl"
version = "0.1.0"
description = "VeraCrawl target architecture foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
veracrawl-contracts = "veracrawl.cli.contracts:main"
veracrawl-fixture = "veracrawl.cli.fixtures:main"
veracrawl-runtime = "veracrawl.cli.runtime:main"
veracrawl-durable = "veracrawl.cli.durable:main"
veracrawl-source = "veracrawl.cli.source:main"
veracrawl-network = "veracrawl.cli.network:main"
veracrawl-process = "veracrawl.cli.process:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veracrawl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
